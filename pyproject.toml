[project]
name = "vrc-dashboard"
version = "0.1.0"
description = "VRChat事前確認ダッシュボード"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.3",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "cryptography>=43.0.1",
    "httpx>=0.27.2",
    "websockets>=13.1",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "pywebpush>=2.0.1",
    # zoneinfoのIANAタイムゾーンDBを提供する（Windowsやslim系Dockerイメージ等、
    # OSにtzdataが無い環境でもZoneInfo("Asia/Tokyo")が解決できるようにするため）。
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.11.2",
    "ruff>=0.6.9",
]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# pywebpushは型スタブ(py.typed)を提供していないため対象外にする。
module = "pywebpush"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"
# Alembicのマイグレーションはautogenerateによる生成物のため対象外にする。
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPIのDepends()/Query()等はデフォルト引数での関数呼び出しが公式に推奨される書き方のため対象外にする。
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
