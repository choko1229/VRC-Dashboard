<div class="friend-filter-bar">
    <div class="friend-tabs">
        {% for tab_value, tab_label in [("online", "オンライン"), ("favorites", "お気に入り"), ("active", "アクティブ"), ("offline", "オフライン")] %}
        <button
            type="button"
            class="friend-tab{% if filter_tab == tab_value %} active{% endif %}"
            hx-get="/friends/partials/list"
            hx-vals='{"filter_tab": "{{ tab_value }}"}'
            hx-include="#friend-search-input"
            hx-target="#friends-panel"
            hx-swap="innerHTML"
            hx-push-url="/friends?filter_tab={{ tab_value }}"
        >{{ tab_label }}</button>
        {% endfor %}
    </div>

    {% if filter_tab == "favorites" %}
    <select
        name="group_id"
        hx-get="/friends/partials/list"
        hx-vals='{"filter_tab": "favorites"}'
        hx-include="#friend-search-input"
        hx-target="#friends-panel"
        hx-swap="innerHTML"
        hx-trigger="change"
    >
        <option value="">すべてのグループ</option>
        {% for group in groups %}
        <option value="{{ group.id }}" {% if group.id == selected_group_id %}selected{% endif %}>{{ group.name }}</option>
        {% endfor %}
    </select>
    {% endif %}

    <input
        id="friend-search-input"
        type="search"
        name="q"
        value="{{ q }}"
        placeholder="フレンドを検索"
        class="friend-search"
        hx-get="/friends/partials/list"
        hx-vals='{"filter_tab": "{{ filter_tab }}"}'
        hx-target="#friends-panel"
        hx-swap="innerHTML"
        hx-trigger="keyup changed delay:400ms, search"
    >
</div>

{% include "friends/_list.html" %}
