{% extends "base.html" %}
{% from "partials/icons.html" import icon_refresh, icon_settings %}
{% block title %}フレンド一覧{% endblock %}
{% block content %}
<div class="friends-page-header">
    <h1 class="app-heading">フレンド一覧</h1>
    <a href="/friends/groups/manage" class="icon-btn" title="グループ管理">{{ icon_settings() }}</a>
</div>

<div id="friends-panel">
    {% include "friends/_panel.html" %}
</div>

<p><button class="btn btn-ghost" hx-post="/friends/sync" hx-target="#sync-result" hx-swap="innerHTML">{{ icon_refresh(16) }} VRChatと同期</button></p>
<div id="sync-result"></div>
{% endblock %}
