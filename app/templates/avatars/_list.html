<div class="avatar-grid">
    {% for avatar in avatars %}
    <a class="avatar-card" href="/avatars/{{ avatar.id }}">
        {% if avatar.thumbnail_image_url %}
        <img class="avatar-thumb" src="{{ avatar.thumbnail_image_url }}" alt="">
        {% endif %}
        <span class="avatar-name">{{ avatar.name }}</span>
        <span class="avatar-status">{{ avatar.release_status }} / {{ avatar.performance_rank or "不明" }}</span>
        <span class="tag-chips">
            {% for tag in avatar_tags_map.get(avatar.id, []) %}
            <span class="tag-chip">{{ tag.name }}</span>
            {% endfor %}
        </span>
    </a>
    {% else %}
    <p class="placeholder">アバターがありません。「VRChatと同期」を試してください。</p>
    {% endfor %}
</div>
