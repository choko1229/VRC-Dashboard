{% extends "base.html" %}
{% block title %}タグ管理{% endblock %}
{% block content %}
<h1 class="app-heading">タグ管理</h1>
<p>アバターに付けるステータスタグを管理します（自由記述ではなく、ここで作成したタグから選択します）。</p>

<form hx-post="/avatars/tags" hx-target="#tags-list" hx-swap="innerHTML">
    <input type="text" name="name" placeholder="新しいタグ名" required>
    <input type="text" name="color" placeholder="色（任意、例: #22C55E）">
    <button type="submit" class="btn">追加</button>
</form>

<div id="tags-list">
    {% include "avatars/_tags_list.html" %}
</div>

<p><a href="/avatars">アバター一覧へ戻る</a></p>
{% endblock %}
