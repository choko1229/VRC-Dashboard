{% extends "base.html" %}
{% from "partials/icons.html" import icon_refresh %}
{% block title %}今日の予定{% endblock %}
{% block content %}
<h1 class="app-heading">今日の予定</h1>

<form hx-post="/schedule/import/vrchat-calendar" hx-target="#import-result" hx-swap="innerHTML" class="import-form">
    <input type="text" name="vrchat_group_id" placeholder="VRChatグループID (grp_...)" required>
    <button type="submit" class="btn btn-ghost">{{ icon_refresh(16) }} VRChatカレンダーから取込</button>
</form>
<div id="import-result"></div>

<p class="view-toggle">
    <button class="btn btn-ghost" hx-get="/schedule/partials/month?year={{ year }}&month={{ month }}" hx-target="#calendar-month" hx-swap="innerHTML">月間表示</button>
    <button class="btn btn-ghost" hx-get="/schedule/partials/week?start_date={{ today.isoformat() }}" hx-target="#calendar-month" hx-swap="innerHTML">週間表示</button>
</p>

<div id="calendar-month"
     hx-get="/schedule/partials/month?year={{ year }}&month={{ month }}"
     hx-trigger="load"
     hx-swap="innerHTML">
    <p class="placeholder">読み込み中...</p>
</div>

<div id="day-panel"></div>

<p><a href="/">ダッシュボードへ戻る</a></p>
{% endblock %}
